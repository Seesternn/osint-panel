name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check panel tests tools/geoclip_worker.py

      - name: Unit tests
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: for f in panel/static/*.js; do node --check "$f"; done

      - name: Shell scripts
        run: |
          bash -n setup.sh
          sh -n docker/entrypoint.sh launch_panel.sh run_panel.sh osint

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: osint-panel:ci
          build-args: WITH_GEOCLIP=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name panel -p 127.0.0.1:5050:5050 osint-panel:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5050/healthz && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:5050/healthz | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:5050/api/catalog | grep -q '"crypto"'
          curl -fsS "http://127.0.0.1:5050/api/tools?lang=en" | grep -q 'Name research'
          docker exec panel /app/.venv/bin/python /app/panel/cli.py detect someone@example.com | grep -qx email
          docker exec panel sh -c 'command -v chromium exiftool ffmpeg tesseract'
          test "$(docker inspect -f '{{.Config.User}}' panel)" = "osint"

      - name: Logs on failure
        if: failure()
        run: docker logs panel || true
