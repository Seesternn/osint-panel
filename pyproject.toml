[project]
name = "osint-panel"
version = "1.0.0"
description = "One search box for ~50 open-source intelligence tools, with cases, evidence archive and watchlist."
authors = [{ name = "Seesternn" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["tools", "sherlock", ".venv"]

[tool.ruff.lint]
# Gerçek hatalar: sözdizimi, tanımsız adlar, kullanılmayan değişken / içe aktarma
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
