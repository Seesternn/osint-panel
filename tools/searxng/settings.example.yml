# OSINT paneli için yerel SearXNG ayarları (yalnızca bu bilgisayardan erişilir)
use_default_settings: true
general:
  instance_name: "osint-panel-searxng"
  enable_metrics: false
search:
  safe_search: 0
  default_lang: "tr"
  formats:
    - html
    - json
server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "__SECRET__"   # setup.sh rastgele bir değer üretir
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
